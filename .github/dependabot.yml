version: 2
updates:
  # The Go dependencies. Five direct ones, and two dozen that come along with
  # them.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # bubbletea, bubbles, lipgloss and glamour are released against each other
      # and share the charmbracelet/x/* helpers. Ungrouped, one of them bumps
      # first and the build breaks on a version pair that was never meant to
      # exist together.
      charmbracelet:
        patterns:
          - github.com/charmbracelet/*
      # The catch-all has to repeat the patterns above as exclude-patterns.
      # Dependabot documents the first matching group as the winner and does not
      # behave that way (dependabot-core#9765, #14143). Without this, it puts
      # bubbletea in the charmbracelet group and bubbles in this one, and the
      # resulting half-update is exactly the version pair the group above exists
      # to prevent.
      go:
        exclude-patterns:
          - github.com/charmbracelet/*
        update-types:
          - minor
          - patch

  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are separate dependencies to Dependabot. Ungrouped, one
      # of them bumps first and the version mismatch fails the codeql job.
      codeql:
        patterns:
          - github/codeql-action*
