name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a runner image that changes under us is noticed in quiet weeks too.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins a patch version; naming one here too would mean editing
          # two places every time the toolchain moves.
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck install.sh scripts/build-dist.sh scripts/notepad-popup.sh tmux-notepad.tmux

  # Go is fully supported by CodeQL, unlike the shell that wraps it — so this
  # analyses both the program and the workflows that build it.
  codeql:
    # Code scanning needs GitHub Advanced Security on a private repository, which
    # the Free plan does not have: the upload would fail. Public, it just runs.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      # init and analyze must always move together — see the codeql group in dependabot.yml.
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The tests that matter start a throwaway tmux server. Without tmux they
      # skip themselves, and a run of nothing but skips would be green — so tmux
      # is installed here and TMUX_NOTEPAD_REQUIRE_TMUX turns those skips into
      # failures.
      #
      # TMUX_NOTEPAD_REQUIRE_CLIENT is deliberately not set: the handful of
      # tests that need a real client attached go through script(1) and a
      # pseudo-terminal, and on a hosted runner every one of those attaches
      # times out. They are enforced on a developer machine instead — see
      # internal/testenv and CONTRIBUTING.md.
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          fi
      - run: tmux -V
      - run: go test -race -count=1 ./...
        env:
          TMUX_NOTEPAD_REQUIRE_TMUX: '1'

  # Known vulnerabilities in the dependency tree. govulncheck reports only what
  # this code can actually reach, so it stays quiet about the parts of a module
  # nothing here calls — which is most of them, for a program that opens no
  # network connections at all.
  #
  # The weekly schedule matters more than the pull-request runs: an advisory
  # appears without anybody touching the code, and this is what notices.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...

  # Short runs, so a change that breaks the note parser or the config reader on
  # some input nobody thought of shows up in the pull request that made it.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz=FuzzParse -fuzztime=60s ./internal/notes/
      - run: go test -run '^$' -fuzz=FuzzLoad -fuzztime=60s ./internal/config/

  # Builds every platform the installer offers, through the same script the
  # release uses — so a broken release build fails here rather than at the tag.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/build-dist.sh 0.0.0 dist
      - run: cat dist/SHA256SUMS
      # Nothing else runs the darwin/amd64 binary — GitHub's Intel macOS
      # runners no longer get scheduled — so at least prove every archive
      # holds a binary built for the platform its name claims. A GOARCH that
      # silently fell back to the host would be caught here.
      - name: Each archive holds a binary for its own platform
        run: |
          for a in dist/*.tar.gz; do
            base=$(basename "$a" .tar.gz)
            platform=${base#tmux-notepad_0.0.0_}
            tmp=$(mktemp -d)
            tar -xzf "$a" -C "$tmp"
            desc=$(file -b "$tmp/$base/tmux-notepad")
            case "$platform" in
              linux_amd64)  want='ELF 64-bit.*x86-64' ;;
              linux_arm64)  want='ELF 64-bit.*ARM aarch64' ;;
              darwin_amd64) want='Mach-O 64-bit.*x86_64' ;;
              darwin_arm64) want='Mach-O 64-bit.*arm64' ;;
              *) echo "unexpected archive $a" >&2; exit 1 ;;
            esac
            echo "$platform: $desc"
            echo "$desc" | grep -Eq "$want" || {
              echo "  ^ does not look like $platform" >&2; exit 1; }
          done
      # Two runs of the same source must produce the same bytes; if they do not,
      # the reproducible-build flags in build-dist.sh have stopped working.
      - name: The build is reproducible
        run: |
          cp dist/SHA256SUMS /tmp/first
          scripts/build-dist.sh 0.0.0 dist
          diff /tmp/first dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 5

  # The one-liner, end to end, against the archives just built: install, check
  # the binary runs and reports the right version, then uninstall and check it
  # left nothing behind.
  installer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install from the built archives
        env:
          TMUX_NOTEPAD_DIST: dist
        run: |
          bash dist/install.sh --prefix "$RUNNER_TEMP/p" --no-bind
          "$RUNNER_TEMP/p/bin/tmux-notepad" --version
          test "$("$RUNNER_TEMP/p/bin/tmux-notepad" --version)" = "tmux-notepad 0.0.0"
      - name: Uninstall leaves nothing behind
        env:
          TMUX_NOTEPAD_DIST: dist
        run: |
          bash dist/install.sh --prefix "$RUNNER_TEMP/p" --no-bind --uninstall
          test ! -e "$RUNNER_TEMP/p/bin/tmux-notepad"
      # A tmux.conf that already binds the key must stop the installer rather
      # than shadow the user's binding.
      - name: A foreign binding is refused without --force
        env:
          TMUX_NOTEPAD_DIST: dist
          TMUX_CONF: ${{ runner.temp }}/tmux.conf
        run: |
          echo "bind n split-window" > "$TMUX_CONF"
          if bash dist/install.sh --prefix "$RUNNER_TEMP/q" 2>"$RUNNER_TEMP/err"; then
            echo "installer overwrote a foreign binding" >&2; exit 1
          fi
          grep -q "already binds" "$RUNNER_TEMP/err"
          bash dist/install.sh --prefix "$RUNNER_TEMP/q" --force
          grep -q "tmux-notepad" "$TMUX_CONF"

  # The macOS binaries are cross-compiled on Linux and nothing else here would
  # notice if they did not start at all.
  #
  # arm64 only: macos-13 was the last Intel runner and it no longer gets
  # scheduled — a job pinned to it sat queued for a quarter of an hour and
  # would block every pull request as a required check. darwin/amd64 is
  # covered by the architecture assertion in build instead, which is weaker
  # and said so.
  smoke:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: The archive for this machine runs on it
        env:
          TMUX_NOTEPAD_DIST: dist
        run: |
          bash dist/install.sh --prefix "$RUNNER_TEMP/p" --no-bind
          test "$("$RUNNER_TEMP/p/bin/tmux-notepad" --version)" = "tmux-notepad 0.0.0"
