name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: go test -race -count=1 ./...
        env:
          TMUX_NOTEPAD_REQUIRE_TMUX: '1'

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a Sigstore-signed statement that these exact files came
      # out of this workflow at this tag. id-token signs it, attestations stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # tpm checks out the default branch, not the tag, and the popup wrapper
      # reads VERSION from that checkout to know which release to fetch. If the
      # file and the tag disagree, every tpm user gets a 404 on first use — so
      # the release stops here instead.
      - name: VERSION matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(tr -d '[:space:]' < VERSION)
          if [ "$have" != "$want" ]; then
            echo "VERSION says '$have' but the tag says '$want'." >&2
            echo "Set VERSION to $want on the default branch before tagging." >&2
            exit 1
          fi

      # The installer gets this version and the checksum of every archive baked
      # in, so the one-liner in the README only ever installs the bytes of its
      # own release.
      - name: Build the release assets
        run: |
          scripts/build-dist.sh "${GITHUB_REF_NAME#v}" dist
          cat dist/SHA256SUMS

      # Anyone can check an asset with `gh attestation verify <file> --repo
      # ni-c/tmux-notepad` before running it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*

      # The same attestation, shipped with the release rather than only stored in
      # GitHub's attestation API: one Sigstore bundle wrapping one in-toto SLSA
      # provenance statement that names every asset. It is what lets
      # `gh attestation verify --bundle` check a download without that API, and it
      # is the file OpenSSF Scorecard reads to call this release signed.
      - name: Ship the attestation with the release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/tmux-notepad.intoto.jsonl

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" \
            '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} /^\[.*\]: / {flag=0} flag' \
            CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*.tar.gz \
            dist/install.sh \
            dist/SHA256SUMS \
            dist/tmux-notepad.intoto.jsonl
